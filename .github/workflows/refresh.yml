name: 청약 데이터 갱신

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 (GitHub 사정에 따라 다소 지연될 수 있음)
  workflow_dispatch:          # 손으로 즉시 실행
    inputs:
      test_email:
        description: '새 공고가 없어도 테스트 메일을 보낸다'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['docs/**']

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 스텝 자신의 env는 그 스텝의 if 조건에서 읽히지 않으므로 job 레벨에 둔다
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 인증키 확인
        env:
          APPLYHOME_SERVICE_KEY: ${{ secrets.APPLYHOME_SERVICE_KEY }}
        run: |
          if [ -z "$APPLYHOME_SERVICE_KEY" ]; then
            echo "::error::저장소 시크릿 APPLYHOME_SERVICE_KEY 가 없습니다."
            echo "::error::gh secret set APPLYHOME_SERVICE_KEY --repo ${{ github.repository }}"
            exit 1
          fi

      - name: 의존성 설치
        run: npm install --no-audit --no-fund --silent

      - name: 이전 스냅샷 보관 (새 공고 판별용)
        run: cp docs/data/listings.json /tmp/prev.json 2>/dev/null || echo "이전 스냅샷 없음"

      - name: 공고 수집 및 사이트 빌드
        env:
          APPLYHOME_SERVICE_KEY: ${{ secrets.APPLYHOME_SERVICE_KEY }}
        run: node build.mjs

      - name: 내 조건에 맞는 새 공고 골라내기
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node notify.mjs /tmp/prev.json ${{ inputs.test_email && '--test' || '' }}

      - name: 이메일 발송
        if: env.MAIL_USERNAME != ''
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          npm install --no-save --silent nodemailer
          node send.mjs

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "바뀐 공고가 없습니다."
            exit 0
          fi
          git commit -m "청약 데이터 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          # 로컬 autosync가 같은 브랜치에 밀 수 있어 몇 번 다시 시도한다
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "푸시 충돌 — 재시도 $i"
            sleep 5
          done
          echo "::warning::데이터는 빌드했지만 푸시하지 못했습니다. 다음 실행에서 반영됩니다."
          exit 0
